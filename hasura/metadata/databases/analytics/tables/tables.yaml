# Staging tables (normalised base data for developers)
- table:
    schema: analytics
    name: stg_areas
  select_permissions:
    - role: user
      permission:
        columns: "*"
        filter: {}
        allow_aggregations: true

- table:
    schema: analytics
    name: stg_conditions
  select_permissions:
    - role: user
      permission:
        columns: "*"
        filter: {}
        allow_aggregations: true

- table:
    schema: analytics
    name: stg_logs
  select_permissions:
    - role: user
      permission:
        columns: "*"
        filter: {}
        allow_aggregations: true
  object_relationships:
    - name: trig
      using:
        manual_configuration:
          remote_table:
            schema: analytics
            name: stg_trigs
          column_mapping:
            trig_id: trig_id
    - name: user
      using:
        manual_configuration:
          remote_table:
            schema: analytics
            name: stg_users
          column_mapping:
            user_id: user_id

