[pytest]
testpaths = api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short --cov=api --cov-report=term-missing --cov-report=xml:coverage.xml
asyncio_mode = auto
markers =
    integration: marks tests as integration tests (require external services)
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning:starlette.*
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:botocore.*
    ignore::DeprecationWarning:jose.*
    ignore:.*utcnow.*:DeprecationWarning:sqlalchemy.*
    ignore:.*decompression bomb.*
    # Starlette's TestClient nudges towards the new httpx2 package; httpx is still
    # a pinned runtime dep here, so silence the transitional notice until we
    # deliberately migrate httpx -> httpx2 (note: StarletteDeprecationWarning is a UserWarning).
    ignore:Using .httpx. with .starlette.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning

[coverage:run]
omit =
    api/start.py
    api/core/telemetry.py
    api/core/tracing.py
