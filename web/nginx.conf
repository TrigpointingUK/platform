# Social media bot detection for Open Graph tag serving
map $http_user_agent $is_og_bot {
    default 0;
    ~*facebookexternalhit 1;
    ~*Twitterbot 1;
    ~*LinkedInBot 1;
    ~*WhatsApp 1;
    ~*Slackbot 1;
    ~*TelegramBot 1;
    ~*Discordbot 1;
}

# Resolve the API host from the incoming Host header (works for both staging and production)
map $host $og_api_host {
    trigpointing.uk   api.trigpointing.uk;
    www.trigpointing.uk api.trigpointing.uk;
    trigpointing.me   api.trigpointing.me;
    default           api.trigpointing.uk;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (Brotli is applied by Cloudflare at the edge)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml application/wasm;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Dynamic robots.txt so the Sitemap URL matches the serving domain
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: facebookexternalhit\nAllow: /\n\nUser-agent: Twitterbot\nAllow: /\n\nUser-agent: LinkedInBot\nAllow: /\n\nUser-agent: *\nAllow: /\n\nSitemap: https://$og_api_host/v1/sitemap\n";
    }

    # Prevent caching of index.html (SPA entry point)
    # This must be a top-level location to catch index.html served via $uri/ (root path)
    # Without this, requests to / serve index.html from location / without cache headers
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Android Auth0 callback fallback page when App Links are disabled
    # Avoid logging callback query params and prevent indexing/caching
    location ~ ^/android/(uk\.trigpointing\.android(?:\.debug)?)/callback$ {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    # Legacy redirects: /trig/ID -> /trigs/ID (old singular path)
    location ~ ^/trig/(\d+)(/photos)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        return 301 /trigs/$1$2;
    }

    # Legacy redirects: /trigs/trig-details.php?t=ID -> /trigs/ID
    location = /trigs/trig-details.php {
        if ($arg_t ~ ^\d+$) {
            return 301 /trigs/$arg_t;
        }
        return 404;
    }

    # Legacy redirects: /trigs/view-album.php?t=ID -> /trigs/ID/photos
    location = /trigs/view-album.php {
        if ($arg_t ~ ^\d+$) {
            return 301 /trigs/$arg_t/photos;
        }
        return 404;
    }

    # Any other .php requests not handled by explicit redirects above
    location ~ \.php$ {
        return 404;
    }

    # Open Graph: proxy social media bot requests to the API for OG meta tags
    # Uses internal proxy instead of 302 redirect so Facebook only hits Cloudflare once
    location ~ ^/trigs/(\d+)$ {
        if ($is_og_bot = 1) {
            rewrite ^/trigs/(\d+)$ /og-proxy/trigs/$1 last;
        }
        try_files $uri @spa_fallback;
    }

    location ~ ^/logs/(\d+)$ {
        if ($is_og_bot = 1) {
            rewrite ^/logs/(\d+)$ /og-proxy/logs/$1 last;
        }
        try_files $uri @spa_fallback;
    }

    # Internal-only location that proxies OG requests to the API
    # Keeps the request within nginx so crawlers make a single external request
    location ~ ^/og-proxy/(trigs|logs)/(\d+)$ {
        internal;
        resolver 10.0.0.2 valid=30s;
        set $og_type $1;
        set $og_id $2;
        proxy_pass https://$og_api_host/v1/$og_type/$og_id/opengraph;
        proxy_set_header Host $og_api_host;
        proxy_set_header User-Agent "TrigpointingUK-SPA/1.0";
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Root path - serve the SPA (for staging where app is at /)
    location / {
        # Try to serve the file directly, otherwise fall back to SPA
        try_files $uri $uri/ @spa_fallback;

        # Cache static assets (hashed filenames, immutable)
        location ~ ^/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # SPA fallback for root path - serve index.html without caching
    # This handles all client-side routes like /trigs, /logs, /users, etc.
    location @spa_fallback {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # Cache static assets under /app/assets/ - MUST come before /app/ location
    location ~ ^/app/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        rewrite ^/app/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /app prefix - serve the SPA (for production where app is at /app/)
    # This handles cases where Vite built with base=/app/
    location /app/ {
        alias /usr/share/nginx/html/;
        # Try to serve the file directly, otherwise trigger 404 which redirects to SPA fallback
        error_page 404 = @app_spa_fallback;
        try_files $uri =404;
    }

    # SPA fallback for /app path - serve index.html without caching
    # This handles all client-side routes like /app/trigs, /app/logs, etc.
    location @app_spa_fallback {
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
