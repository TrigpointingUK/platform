# Apache MPM tuning — constrains phpBB's MySQL connection footprint.
#
# The php:8.2-apache base image ships mpm_prefork with MaxRequestWorkers 150.
# Each worker opens its own MySQL connection, but trigpointing-db is a
# db.t4g.micro capping out around 60 connections *shared with MediaWiki*.
# A single phpBB container could therefore exhaust the whole database and take
# the wiki down with it — which is exactly what happened on 2026-08-11, when a
# session-rotating scraper drove ~560 requests/minute and Apache logged
# "AH00161: server reached MaxRequestWorkers setting".
#
# Connection budget for trigpointing-db (~60 total):
#   phpBB      24  (this file)
#   MediaWiki  ~20
#   admin/phpMyAdmin/migrations/headroom  ~15
#
# Capping workers means excess requests queue in the listen backlog and are
# served a little slower under burst. That is dramatically better than
# exhausting the shared database, which fails every site on the instance.
#
# conf-enabled/*.conf is included after mods-enabled/*.conf, so these values
# override the defaults in mods-available/mpm_prefork.conf.

<IfModule mpm_prefork_module>
    StartServers             4
    MinSpareServers          4
    MaxSpareServers          8
    MaxRequestWorkers        24
    # Recycle workers periodically so a leaked connection cannot pin a slot
    # for the full 8-hour MySQL wait_timeout.
    MaxConnectionsPerChild   500
</IfModule>

# Bound how long a stuck client can hold a worker (and its DB connection).
Timeout 30
KeepAliveTimeout 2
